<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartAttend</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <span>🎯</span>
                <span>SmartAttend</span>
            </div>
            <h2>Welcome Back</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Login to access your dashboard</p>

            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-container">
                        <input type="password" id="login-password" required placeholder="••••••••">
                        <span class="password-toggle" id="toggle-password">👁️</span>
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="remember" style="width: auto;">
                        <label for="remember" style="margin: 0; font-size: 0.875rem;">Remember me</label>
                    </div>
                    <a href="#" style="color: var(--primary); text-decoration: none; font-size: 0.875rem;">Forgot
                        Password?</a>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>

            <p style="margin-top: 2rem; color: var(--text-secondary);">
                Don't have an account? <a href="register.html"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">Register</a>
            </p>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('login-password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '🔒';
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.email === email && u.password === pass);

            if (user) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', JSON.stringify({ name: user.name, email: user.email }));
                window.location.href = 'index.html';
            } else {
                alert("Invalid email or password!");
            }
        });
    </script>
</body>

</html>
