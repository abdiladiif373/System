<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartAttend</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <span>🎯</span>
                <span>SmartAttend</span>
            </div>
            <h2>Create Account</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Join the future of attendance management</p>

            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-container">
                        <input type="password" id="reg-password" required placeholder="••••••••">
                        <span class="password-toggle" onclick="toggleVisibility('reg-password', this)">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-container">
                        <input type="password" id="reg-confirm" required placeholder="••••••••">
                        <span class="password-toggle" onclick="toggleVisibility('reg-confirm', this)">👁️</span>
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Register</button>
            </form>

            <p style="margin-top: 2rem; color: var(--text-secondary);">
                Already have an account? <a href="login.html"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">Login</a>
            </p>
        </div>
    </div>

    <script>
        function toggleVisibility(inputId, toggleEl) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            toggleEl.textContent = type === 'password' ? '👁️' : '🔒';
        }

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (password !== confirm) {
                alert("Passwords do not match!");
                return;
            }

            // Mock registration with users list
            const users = JSON.parse(localStorage.getItem('users')) || [];
            users.push({ name, email, password });
            localStorage.setItem('users', JSON.stringify(users));

            // Set for immediate login redirect context if needed
            localStorage.setItem('currentUser', JSON.stringify({ name, email }));

            alert("Registration successful!");
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
